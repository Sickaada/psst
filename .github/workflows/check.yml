name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run AlienCoreTests
      - run: swift build -c release --product AlienPing
      - run: python3 scripts/test_pipeline.py
      - run: python3 scripts/test_signing.py
      - run: python3 scripts/validate_sprites.py
